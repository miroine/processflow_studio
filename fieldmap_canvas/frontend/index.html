<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --ink: #243746; --muted: #6f6f6f; --line: #dcdcdc; --accent: #007079; --sea: #eef5f9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: Equinor, Inter, "Segoe UI", Tahoma, Arial, sans-serif; color: var(--ink);
    background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #app { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: #fff; box-shadow: 0 1px 6px rgba(36,55,70,.08); }
  #toolbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 5px 6px; background: #fff;
    border-bottom: 3px solid var(--accent); }
  #toolbar button { font: inherit; font-size: 12px; font-weight: 500; padding: 4px 10px; border: 1px solid #c7c7c7;
    border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; min-height: 30px; }
  #toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  #toolbar button.on { background: #deedee; border-color: var(--accent); color: #004f55; }
  #toolbar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
  #toolbar .title { font-weight: 700; font-size: 12px; color: var(--accent); margin-right: 6px; letter-spacing: .06em; }
  #wrap { position: relative; flex: 1; min-height: 0; }
  #svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #svg.panning { cursor: grabbing; }
  #hint { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: var(--muted); background: rgba(255,255,255,.88);
    padding: 2px 6px; border-radius: 3px; pointer-events: none; max-width: 55%; text-align: right; }
  #tip { position: absolute; display: none; pointer-events: none; font-size: 11.5px; background: #243746; color: #fff;
    padding: 5px 8px; border-radius: 5px; max-width: 320px; line-height: 1.35; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .item { cursor: move; }
  .hit { cursor: pointer; }
  .legend-row { cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <span class="title">FIELD LAYOUT</span>
    <button id="bZin" title="Zoom in">+</button>
    <button id="bZout" title="Zoom out">−</button>
    <button id="bFit" title="Zoom to fit (double-click the sea)">Fit</button>
    <span class="sep"></span>
    <button id="bDist" class="on" title="Show line lengths">Distances</button>
    <button id="bInfo" class="on" title="Show results under the structures">Info</button>
    <button id="bSlots" title="Show well names on the template slots">Slot names</button>
    <button id="bGrid" class="on" title="Kilometre grid">Grid</button>
    <button id="bCurve" class="on" title="Curved or straight routes">Curves</button>
    <span class="sep"></span>
    <button id="bRot" title="Rotate the selected structure by 15° (R; Shift+R the other way)">Rotate</button>
    <button id="bReset" title="Put every structure back where the flowsheet places it">Reset layout</button>
    <button id="bSvg" title="Download the drawing as SVG">Export SVG</button>
  </div>
  <div id="wrap">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hint"></div>
    <div id="tip"></div>
  </div>
</div>
<script src="./fieldmap.js"></script>
</body>
</html>
