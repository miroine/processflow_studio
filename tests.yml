# Runs every verification suite on each push and pull request, on the real Streamlit and Plotly
# (the build environment can only use stubs), real headless Chromium and Node.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]     # Streamlit Community Cloud currently runs 3.14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Show versions
        run: python -c "import streamlit, plotly, numpy, scipy, pandas; print('streamlit', streamlit.__version__, '| plotly', plotly.__version__, '| numpy', numpy.__version__)"
      - name: Run all suites
        run: python tests/run_all.py
      - name: Upload canvas screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-py${{ matrix.python-version }}
          path: tests/_screens/
          if-no-files-found: ignore
