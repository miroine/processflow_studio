[theme]
base = "light"
primaryColor = "#007079"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F7"
textColor = "#3D3D3D"
font = "sans serif"

[client]
# show the real error message instead of Streamlit Cloud's redacted one (this app has no secrets)
showErrorDetails = true

[server]
maxUploadSize = 20
